[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "oar"
version = "0.1.0"
description = "Local optimizer-aware residual auditing research"
requires-python = ">=3.12"
dependencies = ["torch", "numpy", "PyYAML", "psutil"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
oar = "oar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
